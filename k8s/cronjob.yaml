apiVersion: batch/v1
kind: CronJob
metadata:
  name: pricewatch-cronjob
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pricewatch-cronjob
              image: ghcr.io/orenvill/pricewatch-cronjob:latest
              imagePullPolicy: Always
              envFrom:
                - secretRef:
                    name: pricewatch-secrets
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "100m"
                limits:
                  memory: "128Mi"
                  cpu: "200m"
