apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricewatch-registration
  labels:
    app: pricewatch-registration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pricewatch-registration
  template:
    metadata:
      labels:
        app: pricewatch-registration
    spec:
      containers:
        - name: pricewatch-registration
          image: ghcr.io/orenvill/pricewatch-registration:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: pricewatch-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
