apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pricewatch-registration
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pricewatch.example.com
      secretName: pricewatch-tls
  rules:
    - host: pricewatch.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pricewatch-registration
                port:
                  number: 80
